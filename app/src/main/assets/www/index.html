<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>依頼掲示板</title>
<style>
/* Layout: a pixel-art guild wall of wooden planks; parchment notices in a 2-col grid; RPG message windows for every dialog; one wooden bar with two tabs. Single dark look on purpose. */
@font-face { font-family: "QBDot"; src: url("fonts/dotgothic16.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "QBPress"; src: url("fonts/pressstart2p.ttf") format("truetype"); font-display: swap; }
:root {
  color-scheme: dark;
  --p: 3px;                         /* 1ドット */
  --wood: #5b3a22; --wood-hi: #7d5332; --wood-lo: #3a2213; --wood-line: #1c0f07;
  --paper: #efdfb6; --paper-hi: #fff4d2; --paper-2: #d8c08b; --paper-3: #a88a58;
  --ink: #2b1a10; --ink-2: #6b5236;
  --win: #262b4c; --win-hi: #3a4170; --win-lo: #141731; --win-line: #f4ead0; --win-text: #f4ead0; --win-dim: #aeb0c8;
  --gold: #f2b632; --gold-hi: #ffe27a; --gold-lo: #a86b12;
  --red: #c0392b; --red-hi: #ec6a55; --red-lo: #6e1b14;
  --shadow: rgba(8, 4, 2, .55);
  --f-jp: "QBDot", "DotGothic16", "Noto Sans CJK JP", "Hiragino Sans", sans-serif;
  --f-px: "QBPress", "Press Start 2P", "QBDot", "DotGothic16", monospace;
  --bar-h: 66px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: #2a1810; color: var(--win-text);
  font-family: var(--f-jp); font-size: 16px; line-height: 1.5;
  overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none;
  -webkit-font-smoothing: none; font-smooth: never;
}
img { image-rendering: pixelated; image-rendering: crisp-edges; }
input, textarea, button { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: var(--p) solid var(--gold-hi); outline-offset: var(--p); }

/* ---------- ドットの箱（角が欠けた枠＋立体の陰影） ---------- */
.px {
  position: relative; background-color: var(--bg);
  box-shadow:
    0 calc(var(--p) * -1) 0 0 var(--line), 0 var(--p) 0 0 var(--line),
    calc(var(--p) * -1) 0 0 0 var(--line), var(--p) 0 0 0 var(--line),
    inset var(--p) var(--p) 0 0 var(--hi), inset calc(var(--p) * -1) calc(var(--p) * -1) 0 0 var(--lo);
}
.drop { filter: drop-shadow(var(--p) var(--p) 0 var(--shadow)); }
.win { --bg: var(--win); --line: var(--win-line); --hi: var(--win-hi); --lo: var(--win-lo); color: var(--win-text); }
.paper { --bg: var(--paper); --line: var(--ink); --hi: var(--paper-hi); --lo: var(--paper-2); color: var(--ink); background-image: var(--tex-paper); background-size: calc(var(--p) * 16) calc(var(--p) * 16); }
.wood { --bg: var(--wood); --line: var(--wood-line); --hi: var(--wood-hi); --lo: var(--wood-lo); }
.pi { display: inline-block; flex: none; width: calc(var(--w) * var(--p)); height: calc(var(--h) * var(--p)); background: currentColor; -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat; }

.app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---------- 壁と看板 ---------- */
.wall {
  flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
  background-image: var(--tex-wall); background-size: calc(var(--p) * 24) calc(var(--p) * 48); background-color: var(--wood);
  image-rendering: pixelated;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + 100px);
}
.head { display: flex; align-items: flex-start; justify-content: center; gap: 12px; max-width: 960px; margin: 0 auto 18px; }
.sign-wrap { position: relative; padding-top: calc(var(--p) * 5); }
.sign-wrap::before, .sign-wrap::after {   /* 看板を吊るす鎖 */
  content: ""; position: absolute; top: 0; width: var(--p); height: calc(var(--p) * 6);
  background: repeating-linear-gradient(180deg, #c9b07a 0 var(--p), #5d4a2a var(--p) calc(var(--p) * 2));
}
.sign-wrap::before { left: 22%; } .sign-wrap::after { right: 22%; }
.sign { padding: 8px 22px 7px; text-align: center; margin: var(--p); }
.sign h1 { margin: 0; font-family: var(--f-jp); font-weight: 400; font-size: 32px; line-height: 1.15; letter-spacing: .12em; color: var(--gold-hi); text-shadow: var(--p) var(--p) 0 var(--wood-line); }
.sign small { display: block; margin-top: 4px; font-family: var(--f-px); font-size: 8px; letter-spacing: .25em; color: var(--gold); }
.sprite { width: 48px; height: 48px; flex: none; margin-top: 14px; filter: drop-shadow(var(--p) var(--p) 0 var(--shadow)); }
.head .sprite { animation: idle 1.2s steps(1) infinite; }
@keyframes idle { 50% { transform: translateY(calc(var(--p) * -1)); } }
.icon-btn { width: 44px; height: 44px; flex: none; margin: 16px var(--p) 0; display: grid; place-items: center; color: var(--gold-hi); border: 0; }
.icon-btn:active { transform: translate(var(--p), var(--p)); }
.tally { max-width: 960px; margin: 0 auto 18px; display: flex; justify-content: center; }
.tally .px { margin: var(--p); padding: 4px 14px; font-size: 14px; color: var(--win-dim); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; justify-content: center; }
.tally b { font-family: var(--f-px); font-weight: 400; font-size: 12px; color: var(--gold-hi); }

/* ---------- 掲示板 ---------- */
.board { max-width: 960px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 18px; }
@media (min-width: 640px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .board { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.notice { display: block; width: 100%; padding: 0; border: 0; background: none; text-align: left; transform: translateY(var(--dy, 0)); animation: pin-in .36s steps(4) both; animation-delay: var(--delay, 0s); }
.notice:active .paper { transform: translate(var(--p), var(--p)); }
@keyframes pin-in { from { opacity: 0; transform: translateY(calc(var(--dy, 0px) - 12px)); } }
.notice .paper { margin: var(--p); padding: 14px 10px 10px; }
.pin { position: absolute; top: calc(var(--p) * -3); left: 50%; width: calc(var(--p) * 6); height: calc(var(--p) * 6); margin-left: calc(var(--p) * -3); z-index: 2; }
.n-no { display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); }
.n-no .kind { font-size: 14px; letter-spacing: .3em; }
.n-no .num { font-family: var(--f-px); font-size: 8px; }
.n-rule { height: var(--p); margin: 4px 0 8px; background: repeating-linear-gradient(90deg, var(--paper-3) 0 calc(var(--p) * 2), transparent calc(var(--p) * 2) calc(var(--p) * 3)); }
.n-img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; box-shadow: 0 0 0 var(--p) var(--ink); }
.n-noimg { aspect-ratio: 4 / 3; display: grid; place-items: center; font-size: 40px; color: var(--paper-3); box-shadow: inset 0 0 0 var(--p) var(--paper-3); }
.n-title { margin: 10px 0 0; font-size: 16px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
.n-due { margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.wax { position: absolute; right: calc(var(--p) * -2); bottom: calc(var(--p) * -2); width: calc(var(--p) * 12); height: calc(var(--p) * 12); display: grid; place-items: center; font-size: 16px; color: #ffe9df; text-shadow: var(--p) 0 0 var(--red-lo); background-size: 100% 100%; image-rendering: pixelated; }
.wax.late { filter: grayscale(1) brightness(.75); font-size: 13px; }
.empty { max-width: 440px; margin: 40px auto; }
.empty .px { margin: var(--p); padding: 18px; }
.empty h2 { margin: 0 0 8px; font-weight: 400; font-size: 20px; color: var(--gold-hi); }
.empty p { margin: 0; color: var(--win-text); }

/* ---------- 冒険の記録 ---------- */
.ledger { max-width: 720px; margin: 0 auto; }
.ledger .book { margin: var(--p); padding: 16px 14px 8px; }
.ledger h2 { margin: 0; text-align: center; font-weight: 400; font-size: 20px; letter-spacing: .3em; }
.ledger .sub { text-align: center; font-size: 13px; color: var(--ink-2); margin: 2px 0 10px; }
.rec { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; padding: 10px 2px; border: 0; background: none; text-align: left; color: var(--ink); background-image: repeating-linear-gradient(90deg, var(--paper-3) 0 calc(var(--p) * 2), transparent calc(var(--p) * 2) calc(var(--p) * 3)); background-size: 100% var(--p); background-repeat: no-repeat; }
.rec-thumb { position: relative; width: 72px; height: 54px; }
.rec-thumb img, .rec-thumb .ph { width: 100%; height: 100%; object-fit: cover; display: block; box-shadow: 0 0 0 var(--p) var(--ink); }
.rec-thumb .ph { display: grid; place-items: center; color: var(--paper-3); background: var(--paper-2); }
.rec-thumb .stamp-mini { position: absolute; right: calc(var(--p) * -4); bottom: calc(var(--p) * -4); width: calc(var(--p) * 11); height: calc(var(--p) * 11); display: grid; place-items: center; font-size: 11px; color: var(--red); background-size: 100% 100%; }
.rec-title { font-size: 16px; line-height: 1.4; overflow-wrap: anywhere; }
.rec-date { font-family: var(--f-px); font-size: 8px; color: var(--ink-2); white-space: nowrap; }
.ledger-foot { margin-top: 16px; display: grid; gap: 10px; justify-items: center; font-size: 13px; color: var(--paper-2); }

/* ---------- ボタン ---------- */
.btn {
  --bg: var(--paper); --line: var(--ink); --hi: var(--paper-hi); --lo: var(--paper-2);
  flex: 1 1 auto; min-height: 46px; margin: var(--p); padding: 6px 14px; border: 0; color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; letter-spacing: .06em;
}
.btn:active:not(:disabled) { transform: translate(var(--p), var(--p)); }
.btn:disabled { opacity: .5; }
.btn.red { --bg: var(--red); --line: var(--red-lo); --hi: var(--red-hi); --lo: #8f2a1f; color: #fff1e8; text-shadow: var(--p) 0 0 var(--red-lo); }
.btn.ghost { --bg: var(--win); --line: var(--win-dim); --hi: var(--win-hi); --lo: var(--win-lo); color: var(--win-dim); }
.btn.gold { --bg: var(--gold); --line: #4a2d06; --hi: var(--gold-hi); --lo: var(--gold-lo); color: #3a2204; width: 100%; min-height: 60px; font-size: 22px; letter-spacing: .25em; }
.link-btn { --bg: var(--win); --line: var(--gold); --hi: var(--win-hi); --lo: var(--win-lo); border: 0; margin: var(--p); padding: 6px 16px; color: var(--gold-hi); font-size: 14px; }

/* ---------- 下のバーと「依頼を貼る」 ---------- */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 0 16px env(safe-area-inset-bottom, 0px); background: var(--wood-lo); box-shadow: 0 calc(var(--p) * -1) 0 0 var(--wood-line), inset 0 var(--p) 0 0 var(--wood-hi); }
.bar-in { max-width: 520px; margin: 0 auto; height: var(--bar-h); display: grid; grid-template-columns: 1fr 1fr; }
.tab { border: 0; background: none; color: var(--paper-2); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; letter-spacing: .08em; }
.tab .cur { visibility: hidden; color: var(--gold-hi); }
.tab[aria-selected="true"] { color: var(--gold-hi); }
.tab[aria-selected="true"] .cur { visibility: visible; animation: blink 1s steps(1) infinite; }
.fab { position: fixed; z-index: 6; right: 18px; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + 20px); width: auto; flex: none; min-height: 54px; padding: 6px 18px; font-size: 17px; }

/* ---------- ウィンドウ（RPGのメッセージ枠） ---------- */
.veil { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(10, 6, 4, .72); padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); animation: fade .15s steps(3) both; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 100%; display: flex; flex-direction: column; animation: pop .2s steps(4) both; }
@keyframes pop { from { transform: scale(.9); opacity: 0; } }
.sheet > .win { margin: var(--p); overflow-y: auto; padding: 20px 16px 16px; -webkit-overflow-scrolling: touch; }
.sheet h2 { margin: 0 0 4px; font-weight: 400; font-size: 22px; text-align: center; color: var(--gold-hi); letter-spacing: .14em; }
.sheet .lead { text-align: center; font-size: 13px; color: var(--win-dim); margin-bottom: 14px; }
.close-x { position: absolute; top: 8px; right: 8px; z-index: 3; width: 40px; height: 40px; border: 0; background: none; color: var(--win-dim); display: grid; place-items: center; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field > label, .field > .lbl { font-size: 14px; color: var(--gold-hi); letter-spacing: .1em; display: flex; align-items: center; gap: 6px; }
.field input, .field textarea {
  width: calc(100% - var(--p) * 2); margin: var(--p); border: 0; padding: 8px 8px; background: var(--win-lo); color: var(--win-text);
  box-shadow: 0 calc(var(--p) * -1) 0 0 var(--win-dim), 0 var(--p) 0 0 var(--win-dim), calc(var(--p) * -1) 0 0 0 var(--win-dim), var(--p) 0 0 0 var(--win-dim);
  user-select: text; -webkit-user-select: text; border-radius: 0;
}
.field textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
.field input:focus, .field textarea:focus { outline: none; box-shadow: 0 calc(var(--p) * -1) 0 0 var(--gold-hi), 0 var(--p) 0 0 var(--gold-hi), calc(var(--p) * -1) 0 0 0 var(--gold-hi), var(--p) 0 0 0 var(--gold-hi); }
.field input::placeholder, .field textarea::placeholder { color: #6f7397; }
.pic-box { display: grid; gap: 8px; }
.pic-box .preview { margin: var(--p); padding: 8px; }
.pic-box .preview img { display: block; width: 100%; max-height: 260px; object-fit: contain; }
.pic-actions { display: flex; gap: 4px; flex-wrap: wrap; }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.hint { font-size: 13px; color: var(--win-dim); }
.busy { font-size: 14px; color: var(--win-dim); text-align: center; padding: 16px 0; }
.busy::after { content: "…"; animation: blink 1s steps(1) infinite; }

/* 詳細 */
.d-head { display: flex; justify-content: space-between; align-items: center; color: var(--win-dim); padding-right: 40px; }
.d-head .kind { font-size: 14px; letter-spacing: .2em; }
.d-head .num { font-family: var(--f-px); font-size: 8px; }
.d-title { margin: 8px 0 12px; font-weight: 400; font-size: 22px; line-height: 1.4; color: var(--win-text); overflow-wrap: anywhere; text-align: left; }
.frame { margin: var(--p); padding: 6px; }
.zoom { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; touch-action: none; background: var(--paper-2); }
.zoom img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 0 0; will-change: transform; image-rendering: auto; mix-blend-mode: multiply; }
.zoom .zhint { position: absolute; left: 6px; bottom: 6px; font-size: 12px; color: var(--win-text); background: var(--win); padding: 2px 8px; pointer-events: none; transition: opacity .3s steps(3); }
.zoom .full { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border: 0; padding: 0; display: grid; place-items: center; color: var(--win-text); --bg: var(--win); --line: var(--win-line); --hi: var(--win-hi); --lo: var(--win-lo); }
.d-meta { display: flex; gap: 14px; flex-wrap: wrap; margin: 12px 0 4px; font-size: 14px; color: var(--win-dim); }
.d-body { margin: 6px 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.8; user-select: text; -webkit-user-select: text; }
.d-body:empty { display: none; }
.done-mark { text-align: center; margin: 8px 0 10px; color: var(--gold-hi); letter-spacing: .2em; }

/* 全画面 */
.lightbox { position: fixed; inset: 0; z-index: 40; background: #120b07; display: flex; flex-direction: column; animation: fade .15s steps(3) both; }
.lightbox .zoom { flex: 1; aspect-ratio: auto; }
.lightbox .close-x { top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; color: var(--win-text); --bg: var(--win); --line: var(--win-line); --hi: var(--win-hi); --lo: var(--win-lo); }

.confirm p { margin: 0 0 12px; text-align: center; }

/* ---------- クエストクリア ---------- */
.qc { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; overflow: hidden; background: #140c06; animation: fade .2s steps(3) both; }
.qc canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
.rays {
  position: absolute; left: 50%; top: 40%; width: 170vmax; height: 170vmax; margin: -85vmax 0 0 -85vmax; opacity: 0;
  background: repeating-conic-gradient(from 0deg, #3d2510 0 9deg, #24160a 9deg 22.5deg);
  animation: show .01s .3s forwards, spin 16s steps(64) infinite;
}
@keyframes show { to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
.qc-stack { position: relative; display: grid; justify-items: center; gap: 12px; padding: 0 16px; text-align: center; width: 100%; max-width: 560px; }
.qc-card { position: relative; width: min(58vw, 240px); animation: card-in .4s steps(5) both; }
.qc-card .paper { margin: var(--p); padding: 10px; }
.qc-card .n-title { -webkit-line-clamp: 2; text-align: center; }
@keyframes card-in { from { opacity: 0; transform: translateY(40px); } }
.qc-card.shake { animation: card-in .4s steps(5) both, shake .24s .8s steps(4); }
@keyframes shake { 25% { translate: calc(var(--p) * -2) var(--p); } 50% { translate: calc(var(--p) * 2) calc(var(--p) * -1); } 75% { translate: calc(var(--p) * -1) 0; } }
.stamp {
  position: absolute; left: 50%; top: 42%; width: calc(var(--p) * 36); height: calc(var(--p) * 36); margin: calc(var(--p) * -18) 0 0 calc(var(--p) * -18); z-index: 3;
  display: grid; place-items: center; align-content: center; color: var(--red); font-size: 32px; line-height: 1; background-size: 100% 100%; image-rendering: pixelated; opacity: 0;
  animation: stamp .3s .55s steps(4) forwards;
}
.stamp small { display: block; font-family: var(--f-px); font-size: 8px; margin-top: 6px; }
@keyframes stamp { 0% { opacity: 0; transform: scale(2.4); } 100% { opacity: 1; transform: scale(1); } }
.qc-title { margin: 10px 0 0; font-family: var(--f-px); font-size: 24px; line-height: 1.2; white-space: nowrap; letter-spacing: .04em; }
@media (min-width: 560px) { .qc-title { font-size: 40px; } }
.qc-title span { display: inline-block; opacity: 0; color: var(--gold-hi); text-shadow: 0 var(--p) 0 var(--gold), 0 calc(var(--p) * 2) 0 var(--gold-lo), var(--p) calc(var(--p) * 3) 0 #2a1604; animation: drop .4s steps(5) forwards; animation-delay: calc(1s + var(--i) * 60ms); }
.qc-title .sp { width: .5em; }
@keyframes drop { 0% { opacity: 0; transform: translateY(-36px); } 60% { opacity: 1; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
.qc-sub { font-size: 20px; color: var(--win-text); letter-spacing: .4em; opacity: 0; animation: show .01s 1.8s forwards; }
.qc-sprite { width: 72px; height: 72px; opacity: 0; animation: show .01s 1.6s forwards, hop .5s 2s steps(2) infinite; }
@keyframes hop { 50% { translate: 0 calc(var(--p) * -4); } }
.qc-tap { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 14px; color: var(--paper-2); letter-spacing: .15em; opacity: 0; animation: show .01s 2.6s forwards; }
.qc-tap .pi { animation: blink 1s 2.6s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* お知らせ */
.update { position: fixed; z-index: 30; left: 16px; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 14px); max-width: 520px; margin: 0 auto; padding: 12px 12px 8px; animation: fade .2s steps(3) both; }
.update p { margin: 0 36px 6px 0; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.update p b { font-weight: 400; color: var(--gold-hi); }
.update .acts { display: flex; flex-wrap: wrap; gap: 4px; }
.update .btn { min-height: 40px; padding: 4px 12px; font-size: 15px; }
.update .close-x { top: 4px; right: 4px; width: 36px; height: 36px; }
.bar-progress { display: block; height: calc(var(--p) * 2); margin-top: 6px; background: var(--win-lo); }
.bar-progress i { display: block; height: 100%; width: 0; background: var(--gold); }
.toast { position: fixed; z-index: 70; left: 16px; right: 16px; bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px) + 92px); width: fit-content; max-width: calc(100% - 32px); margin: 0 auto; padding: 8px 16px; font-size: 14px; text-align: center; overflow-wrap: anywhere; animation: fade .15s steps(3) both; }

/* 報酬（コレクション連携） */
.qc-reward { display: flex; align-items: center; gap: 10px; margin: 4px var(--p) 0; padding: 8px 14px; font-size: 16px; opacity: 0; animation: show .01s 2.2s forwards; max-width: calc(100% - 8px); }

<script>

    async put(q) { await ready; mem.set(q.id, q); if (db) { try { await run("readwrite", (s) => s.put(q)); } catch (e) { toast("保存できませんでした。空き容量を確かめてください。"); } } },
    async remove(id) { await ready; mem.delete(id); if (db) { try { await run("readwrite", (s) => s.delete(id)); } catch (e) {} } },

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },

/* ---------- 状態 ---------- */
let quests = [];

let soundOn = LS.get("qb.sound", true);

/* ---------- 小道具 ---------- */
function hash(str) { let h = 2166136261; for (const c of String(str)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

const todayStart = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
function dueInfo(due) {
  if (!due) return null;
  const d = new Date(due + "T00:00:00"); if (isNaN(d)) return null;
  const days = Math.round((d - todayStart()) / 86400000);
  const label = `${d.getMonth() + 1}月${d.getDate()}日`;
  const rest = days > 0 ? `あと${days}日` : days === 0 ? "今日まで" : `${-days}日過ぎています`;
  return { label, rest, days };
}
const fmtDate = (t) => { const d = new Date(t); return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, "0")}.${String(d.getDate()).padStart(2, "0")}`; };

/* ============================================================
   ドット絵の素材（すべてこの場で描く）

function gridToCanvas(rows, colors, scale = 1) {

}
const gridURL = (rows, colors, scale) => gridToCanvas(rows, colors, scale).toDataURL();

/* 単色アイコン（文字色で塗られる） */
const ICONS = {
  plus: ["...##...", "...##...", "...##...", "########", "########", "...##...", "...##...", "...##..."],
  close: ["#.....#", ".#...#.", "..#.#..", "...#...", "..#.#..", ".#...#.", "#.....#"],
  cursor: ["#....", "##...", "###..", "####.", "###..", "##...", "#...."],
  board: ["############", "#..........#", "#.###..###.#", "#.#.#..#.#.#", "#.###..###.#", "#..........#", "#.###..###.#", "#.#.#..#.#.#", "#.###..###.#", "#..........#", "############"],
  book: [".####..####.", "#....##....#", "#.##.##.##.#", "#....##....#", "#.##.##.##.#", "#....##....#", "#.##.##.##.#", "#....##....#", ".####..####."],
  soundOn: ["....#.......", "...##...#...", "####.#...#..", "#...#..#..#.", "#...#...#.#.", "#...#...#.#.", "#...#..#..#.", "####.#...#..", "...##...#...", "....#......."],
  soundOff: ["....#.......", "...##.......", "####.#.#...#", "#...#...#.#.", "#...#....#..", "#...#...#.#.", "#...#..#...#", "####.#......", "...##.......", "....#......."],

  picture: ["############", "#..........#", "#.......##.#", "#.......##.#", "#...#......#", "#..###..#..#", "#.#####.##.#", "############"],
  full: ["###...###", "#.......#", "#.......#", ".........", ".........", ".........", "#.......#", "#.......#", "###...###"],

const ICON_URL = {};
for (const [k, g] of Object.entries(ICONS)) ICON_URL[k] = { url: gridURL(g, { "#": "#000" }, 8), w: Math.max(...g.map((r) => r.length)), h: g.length };

/* 丸いドット絵（封蝋・はんこ・ピン） */
function circleSprite(size, { fill, hi, lo, ring, ringOnly = false, thickness = 2 }) {

  for (let y = 0; y < size; y++) for (let i = 0; i < size; i++) {

const SPR = {};

/* 壁（木の板）と紙のタイル */

    x.fillStyle = v("--wood-hi"); x.fillRect(p * 12 + 1, 0, 1, 48);
    x.fillStyle = v("--wood-lo"); x.fillRect(p * 12 + 10, 0, 1, 48);
    x.fillStyle = v("--wood-line"); x.fillRect(p * 12 + 11, 0, 1, 48);
    for (let k = 0; k < 9; k++) { x.fillStyle = r() < 0.5 ? v("--wood-lo") : "#6a4429"; x.fillRect(p * 12 + 2 + Math.floor(r() * 8), Math.floor(r() * 48), 1, 2 + Math.floor(r() * 5)); }
  }

  x.fillStyle = "#a99a7c"; x.fillRect(5, 33, 1, 1); x.fillRect(17, 8, 1, 1);  // 釘
  x.fillStyle = "#2a2018"; x.fillRect(6, 34, 1, 1); x.fillRect(18, 9, 1, 1);
  document.documentElement.style.setProperty("--tex-wall", `url(${c.toDataURL()})`);

  for (let i = 0; i < 26; i++) { x.fillStyle = r() < 0.7 ? "rgba(168,138,88,.35)" : "rgba(255,248,220,.6)"; x.fillRect(Math.floor(r() * 16), Math.floor(r() * 16), 1, 1); }

  SPR.wax = circleSprite(12, { fill: v("--red"), hi: v("--red-hi"), lo: v("--red-lo"), ring: v("--red-lo") });
  SPR.stamp = circleSprite(36, { ring: v("--red"), ringOnly: true, thickness: 2 });
  SPR.coin = circleSprite(10, { fill: v("--gold"), hi: v("--gold-hi"), lo: v("--gold-lo"), ring: "#4a2d06" });
  SPR.stampMini = circleSprite(11, { ring: v("--red"), fill: "rgba(239,223,182,.85)", hi: "rgba(239,223,182,.85)", lo: "rgba(239,223,182,.85)" });
}

/* 内蔵の仮ドット絵（16×16） */
const SPRITE = [
  "......kkkk......",
  ".....khhhhk.....",
  "....khhhhhhk....",
  "....khsssshk....",
  "....kskssksk....",
  "....kssssssk....",
  ".....kssssk.....",
  "....krbbbbrk....",
  "...krbbyybbrk...",
  "...ksbbbbbbsk.g.",
  "...kkbbbbbbkkgk.",
  ".....kBBBBk..k..",
  ".....kBkkBk.....",
  ".....knk.knk....",
  "....kknk.knkk...",
  "....kkkk.kkkk...",
];
const BUILTIN_SPRITE = gridURL(SPRITE, { k: "#24150d", h: "#8a4a22", s: "#f1c18f", b: "#3d62ad", B: "#28417a", y: "#e0ab45", r: "#a8352b", n: "#5a3620", g: "#d7dde3" }, 1);
function spriteSrc(name) {
  return new Promise((res) => { const im = new Image(); im.onload = () => res(im.src); im.onerror = () => res(BUILTIN_SPRITE); im.src = `pixel/${name}.png`; });
}
let heroSrc = BUILTIN_SPRITE, heroClearSrc = BUILTIN_SPRITE;

/* ============================================================
   写真の加工
   ・image … 拡大して見る用のモノクロ版画風（細かい）
   ・thumb … 依頼書に貼る、4色のドット絵（ディザ）
   ============================================================ */
async function loadImage(src) {
  const isFile = typeof src !== "string"; const url = isFile ? URL.createObjectURL(src) : src;
  try { const im = new Image(); im.src = url; await im.decode(); return im; } finally { if (isFile) setTimeout(() => URL.revokeObjectURL(url), 1000); }
}
function toMonochrome(src, sw, sh) {
  const max = 1280; const s = Math.min(1, max / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * s)), h = Math.max(1, Math.round(sh * s));
  const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  x.drawImage(src, 0, 0, w, h);

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const INK4 = [[43, 26, 16], [107, 82, 54], [184, 156, 108], [239, 223, 182]];
function toPixelThumb(im) {
  const W = 96, H = 72;
  const sw = im.naturalWidth || im.width, sh = im.naturalHeight || im.height;
  const s = Math.max(W / sw, H / sh); const dw = sw * s, dh = sh * s;
  const c = document.createElement("canvas"); c.width = W; c.height = H; const x = c.getContext("2d");

async function ensureThumbs() {
  for (const q of quests) {
    if (q.image && !q.thumb) { try { q.thumb = toPixelThumb(await loadImage(q.image)); await Store.put(q); } catch (e) {} }
  }
}

/* ---------- 見本の依頼（最初の1回だけ） ---------- */
function sampleArt(kind) {
  const w = 800, h = 600; const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d");
  const r = rng(kind === "shelf" ? 11 : 23);
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, "#cfd8e0"); g.addColorStop(1, "#7d8a92"); x.fillStyle = g; x.fillRect(0, 0, w, h);
  if (kind === "shelf") {
    x.fillStyle = "#4a3324"; x.fillRect(120, 60, 560, 500);
    for (let s = 0; s < 4; s++) {
      const y0 = 90 + s * 118; x.fillStyle = "#2a1a10"; x.fillRect(140, y0, 520, 100);
      let bx = 150; while (bx < 640) { const bw = 14 + r() * 26, bh = 60 + r() * 36; x.fillStyle = `hsl(${r() * 360},40%,${30 + r() * 40}%)`; x.fillRect(bx, y0 + 100 - bh, bw, bh); bx += bw + 2; }

async function seedIfFirstRun() {

  const dueStr = `${due.getFullYear()}-${String(due.getMonth() + 1).padStart(2, "0")}-${String(due.getDate()).padStart(2, "0")}`;
  const samples = [
    { no: 1, title: "【見本】本棚の一段目を片づける", detail: "これは見本の依頼書です。\n写真は掲示板ではドット絵に、くわしく見るときはモノクロの版画風になります。\n「クエストクリア」を押して達成の演出を試してみてください。", due: dueStr, image: sampleArt("shelf") },
    { no: 2, title: "【見本】丘の上の塔まで散歩する", detail: "見本です。不要なら「取り下げる」で消せます。", due: "", image: sampleArt("hill") },
    { no: 3, title: "【見本】写真なしの依頼書", detail: "写真を付けずに貼ることもできます。", due: "", image: "" },
  ];

/* ============================================================
   描画
   ============================================================ */
function nextNo() { return quests.reduce((m, q) => Math.max(m, q.no || 0), 0) + 1; }

function render() {
  const open = quests.filter((q) => !q.clearedAt).sort((a, b) => a.createdAt - b.createdAt);
  const done = quests.filter((q) => q.clearedAt).sort((a, b) => b.clearedAt - a.clearedAt);

  $("#tabLedger").setAttribute("aria-selected", tab === "ledger");

  $("#viewLedger").hidden = tab !== "ledger";

    ? `<span>掲示中 <b>${open.length}</b></span><span>達成 <b>${done.length}</b></span>`

/* ---------- ピンチで拡大できる絵 ---------- */
function makeZoomable(box) {
  const img = box.querySelector("img"); let s = 1, tx = 0, ty = 0; const pts = new Map(); let base = null; let lastTap = 0, lastPt = null;
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; };
  const clamp = () => { const w = box.clientWidth, h = box.clientHeight; if (s <= 1) { s = 1; tx = 0; ty = 0; return; } tx = Math.min(0, Math.max(w - w * s, tx)); ty = Math.min(0, Math.max(h - h * s, ty)); };
  const local = (e) => { const r = box.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const snap = () => {
    const a = [...pts.values()];
    if (a.length >= 2) base = { s, tx, ty, d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y), m: { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 } };
    else if (a.length === 1) base = { s, tx, ty, p: { ...a[0] } };
    else base = null;
  };
  const hint = box.querySelector(".zhint");
  box.addEventListener("pointerdown", (e) => { if (e.target.closest(".full")) return; box.setPointerCapture(e.pointerId); pts.set(e.pointerId, local(e)); snap(); if (hint) hint.style.opacity = 0; });
  box.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, local(e)); const a = [...pts.values()];
    if (a.length >= 2 && base && base.d) {
      const d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y); const m = { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
      s = Math.min(6, Math.max(1, base.s * d / base.d)); const k = s / base.s;
      tx = m.x - (base.m.x - base.tx) * k; ty = m.y - (base.m.y - base.ty) * k; clamp(); apply();
    } else if (a.length === 1 && base && base.p && s > 1) {
      tx = base.tx + (a[0].x - base.p.x); ty = base.ty + (a[0].y - base.p.y); clamp(); apply();
    }
  });
  const up = (e) => {
    if (!pts.has(e.pointerId)) return; const p = pts.get(e.pointerId); pts.delete(e.pointerId); snap();
    if (pts.size === 0) {
      const now = Date.now();
      if (now - lastTap < 300 && lastPt && Math.hypot(p.x - lastPt.x, p.y - lastPt.y) < 30) {
        if (s > 1) { s = 1; tx = 0; ty = 0; } else { s = 2.6; tx = p.x - p.x * s; ty = p.y - p.y * s; clamp(); }
        img.style.transition = "transform .25s ease"; apply(); setTimeout(() => (img.style.transition = ""), 260); lastTap = 0;
      } else { lastTap = now; lastPt = p; }
    }
  };
  box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);
}

function fanfare() {
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC(); const t0 = ac.currentTime + 0.05;
    const master = ac.createGain(); master.gain.value = 0.2; master.connect(ac.destination);
    const note = (f, t, d, type = "square", v = 0.5) => { const o = ac.createOscillator(); const g = ac.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.setValueAtTime(v, t + d * 0.7); g.gain.linearRampToValueAtTime(0, t + d); o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05); };
    note(196, t0 + 0.55, 0.12, "square", 0.35);                        // はんこの音
    [[392, 0], [523.25, .1], [659.25, .2], [783.99, .3], [659.25, .46], [783.99, .56]].forEach(([f, dt]) => note(f, t0 + 1.0 + dt, 0.09));
    note(1046.5, t0 + 1.72, 0.9, "square", 0.45);
    [[130.81, 0], [196, .46], [261.63, .72]].forEach(([f, dt], i) => note(f, t0 + 1.0 + dt, i === 2 ? 1.0 : 0.3, "triangle", 0.6));
    setTimeout(() => ac.close(), 4000);
  } catch (e) {}
}
function sparkles(canvas) {
  const P = 3; const ctx = canvas.getContext("2d");
  const W = canvas.width = Math.ceil(canvas.clientWidth / P), H = canvas.height = Math.ceil(canvas.clientHeight / P);
  ctx.imageSmoothingEnabled = false;
  const parts = []; const cx = W / 2, cy = H * 0.4;
  const COLS = ["#ffe27a", "#f2b632", "#fff4d2", "#ec6a55"];
  const burst = (n, speed) => { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = (0.3 + Math.random()) * speed; parts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, big: Math.random() < 0.35, col: COLS[i % 4], tw: Math.random() * 6 }); } };
  let t = 0, alive = true;
  setTimeout(() => burst(70, 3), 600); setTimeout(() => burst(50, 2.2), 1050);
  const tick = () => {
    if (!alive) return; t++;
    if (t % 2 === 0) {
      ctx.clearRect(0, 0, W, H);
      if (t % 8 === 0 && t > 70) parts.push({ x: Math.random() * W, y: -2, vx: 0, vy: 0.4 + Math.random() * 0.5, life: 2, big: Math.random() < 0.3, col: COLS[Math.floor(Math.random() * 3)], tw: Math.random() * 6, fall: true });
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.x += p.vx; p.y += p.vy; if (!p.fall) { p.vx *= 0.94; p.vy = p.vy * 0.94 + 0.06; } p.life -= p.fall ? 0.004 : 0.016; p.tw += 0.5;
        if (p.life <= 0 || p.y > H + 4) { parts.splice(i, 1); continue; }
        if (Math.sin(p.tw) < -0.6) continue;   // チカチカ
        const x = Math.round(p.x), y = Math.round(p.y); ctx.fillStyle = p.col;
        ctx.fillRect(x, y, 1, 1);
        if (p.big) { ctx.fillRect(x - 1, y, 3, 1); ctx.fillRect(x, y - 1, 1, 3); if (Math.sin(p.tw) > 0.5) { ctx.fillRect(x - 2, y, 1, 1); ctx.fillRect(x + 2, y, 1, 1); ctx.fillRect(x, y - 2, 1, 1); ctx.fillRect(x, y + 2, 1, 1); } }
      }
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  return () => { alive = false; };
}

/* ============================================================
   コレクションアプリ（ステッカー）との連携
   ・最初にウェブアプリのURL＋アカウント＋暗証番号で登録 → 合言葉（token）を保存
   ・クリアのたびに達成報告。報酬の中身はウェブアプリ側（Settingsシート）が決める
   ・電波が無いときは送り箱にためて、つながったときにまとめて送る
   ============================================================ */
const Link = (() => {
  const get = () => LS.get("qb.link", null);
  const set = (v) => LS.set("qb.link", v);
  const outbox = () => LS.get("qb.outbox", []);
  const setOutbox = (v) => LS.set("qb.outbox", v);
  async function post(url, body) {
    let res;
    try { res = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect: "follow" }); }
    catch (e) { const err = new Error("offline"); err.offline = true; throw err; }
    const text = await res.text();
    try { return JSON.parse(text); }
    catch (e) { throw new Error("ウェブアプリから正しい返事がありませんでした。URLと公開設定（アクセスできるユーザー：全員）を確かめてください。"); }
  }
  async function register(url, name, pin) {
    const r = await post(url, { action: "register", name, pin, device: Native ? "Android" : "browser" });
    if (!r.ok) throw new Error(r.error || "登録できませんでした。");
    set({ url, token: r.token, name: r.student.name, id: r.student.id, reward: r.reward, linkedAt: Date.now() });
    return r;
  }
  async function status() {
    const l = get(); if (!l) return null;
    const r = await post(l.url, { action: "status", token: l.token });
    if (r.ok) { set({ ...l, name: r.student.name, reward: r.reward }); return r; }
    if (r.code === "unlinked") { unlink(); }
    throw new Error(r.error || "状態を確かめられませんでした。");
  }
  function unlink() { set(null); setOutbox([]); }
  async function sendOne(l, job) { return post(l.url, { action: "clear", token: l.token, questId: job.questId, title: job.title, clearedAt: job.clearedAt, due: job.due || "" }); }
  async function reportClear(q) {
    const l = get(); if (!l) return { skipped: true };
    const job = { questId: q.id, title: q.title, clearedAt: q.clearedAt, due: q.due || "", tries: 0 };
    try {
      const r = await sendOne(l, job);
      if (r.code === "unlinked") { unlink(); }
      flush();
      return r;
    } catch (e) {
      if (e.offline) { const box = outbox(); if (!box.some((j) => j.questId === job.questId)) box.push(job); setOutbox(box); return { queued: true }; }
      return { ok: false, error: e.message };
    }
  }
  let flushing = false;
  async function flush() {
    const l = get(); if (!l || flushing) return; flushing = true;
    try {
      let box = outbox(); const got = [];
      while (box.length) {
        const job = box[0];
        try {
          const r = await sendOne(l, job);
          if (r.code === "unlinked") { unlink(); return; }
          if (r.ok && !r.duplicate && !r.limited) got.push(r.reward);
          if (!r.ok && ++job.tries < 5) { setOutbox(box); break; }
        } catch (e) { if (e.offline) break; if (++job.tries < 5) { setOutbox(box); break; } }
        box = box.slice(1); setOutbox(box);
      }
      const text = got.map(rewardText).filter(Boolean).join("、");
      if (text) toast(`届いていなかった報酬：${text}`);
    } finally { flushing = false; }
  }
  return { get, isLinked: () => !!(get() && get().token), register, status, unlink, reportClear, flush, pending: () => outbox().length };
})();
function rewardText(r) {
  if (!r) return "";
  const parts = [...(r.coins || []).map((c) => `${c.name}×${c.qty}`), ...(r.items || []).map((i) => i.name)];
  return parts.join("・");
}
function showReward(box, res) {
  if (!box) return;
  const coin = `<img src="${SPR.coin}" alt="">`;
  let html;
  if (res.queued) html = `<div class="lines"><span>報酬は電波がつながったら届けます</span></div>`;
  else if (!res.ok) html = `<div class="lines"><span>報酬を届けられませんでした</span><span class="dim">${esc(res.error || "")}</span></div>`;
  else if (res.duplicate) html = `<div class="lines"><span>この依頼の報酬は受け取り済みです</span></div>`;
  else if (res.limited) html = `<div class="lines"><span>今日の報酬は上限に達しました</span><span class="dim">達成の記録はちゃんと残っています</span></div>`;
  else {
    const t = rewardText(res.reward);
    const count = res.reward && res.reward.goalCount ? `目標達成 通算${res.reward.goalCount}回目` : "目標達成として記録しました";
    html = t ? `${coin}<div class="lines"><span>${esc(t)} を手に入れた！</span><span class="dim">${count}</span></div>` : `<div class="lines"><span>${count}</span><span class="dim">今回のコインはありません</span></div>`;
  }
  box.innerHTML = html;
}
function openLinkWindow() {
  const l = Link.get();
  const el = document.createElement("div"); el.className = "veil";
  const preview = (r) => (r && r.summary) || rewardText(r) || "なし";
  el.innerHTML = `<div class="sheet drop"><button class="close-x" aria-label="閉じる"><span data-icon="close"></span></button><div class="px win">
    <h2>コレクション連携</h2><div class="lead">依頼をクリアすると、ステッカーコレクションで「目標達成」として数えられ、目標の報酬が届きます</div>
    ${l ? `<div class="px win link-state"><div><b>${esc(l.name)}</b> と連携しています</div><div class="dim">目標の報酬：<span id="lnkReward">${esc(preview(l.reward))}</span></div>${Link.pending() ? `<div class="dim">届いていない報告：${Link.pending()}件</div>` : ""}</div>
         <p class="err" id="lnkErr"></p>
         <div class="row"><button class="btn ghost px" data-a="unlink">連携を解除する</button><button class="btn px" data-a="check">報酬を確かめる</button></div>`
      : `<form id="lnkForm" autocomplete="off">
        <div class="field"><label for="lnkUrl"><span data-icon="cursor"></span>ウェブアプリのURL</label><input id="lnkUrl" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(LS.get("qb.lastUrl", ""))}"></div>
        <div class="field"><label for="lnkName"><span data-icon="cursor"></span>アカウント（名前かStudent ID）</label><input id="lnkName" maxlength="40"></div>
        <div class="field"><label for="lnkPin"><span data-icon="cursor"></span>暗証番号</label><input id="lnkPin" type="password" inputmode="numeric" maxlength="12"></div>
        <p class="err" id="lnkErr"></p>
        <div class="row"><button type="button" class="btn ghost px" data-a="later">あとで</button><button type="submit" class="btn red px" id="lnkGo">連携する</button></div>
      </form>`}
  </div></div>`;
  const layer = pushLayer(el);
  const err = (m) => { const e = el.querySelector("#lnkErr"); if (e) e.textContent = m || ""; };
  el.addEventListener("click", async (e) => {
    if (e.target === el || e.target.closest(".close-x")) { layer.close(); return; }
    const a = e.target.closest("[data-a]"); if (!a) return;
    if (a.dataset.a === "later") layer.close();
    else if (a.dataset.a === "unlink") {
      if (await confirmBox("連携を解除しますか？これからのクリアでは報酬が届かなくなります。", "解除する")) { Link.unlink(); layer.close(); render(); toast("連携を解除しました"); }
    } else if (a.dataset.a === "check") {
      a.disabled = true; err("");
      try { const r = await Link.status(); const sp = el.querySelector("#lnkReward"); if (sp) sp.textContent = preview(r.reward); toast("報酬の設定を読み込みました"); Link.flush(); }
      catch (ex) { err(ex.offline ? "電波がつながっていません。" : ex.message); if (!Link.isLinked()) { layer.close(); render(); } }
      a.disabled = false;
    }
  });
  const form = el.querySelector("#lnkForm");
  if (form) form.addEventListener("submit", async (e) => {
    e.preventDefault(); err("");
    const url = el.querySelector("#lnkUrl").value.trim(), name = el.querySelector("#lnkName").value.trim(), pin = el.querySelector("#lnkPin").value.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { err("URLは https://script.google.com/ で始まり /exec で終わるものを入れてください。"); return; }
    if (!name || !pin) { err("アカウントと暗証番号を入れてください。"); return; }
    LS.set("qb.lastUrl", url);
    const go = el.querySelector("#lnkGo"); go.disabled = true; go.textContent = "確かめています";
    try { const r = await Link.register(url, name, pin); layer.close(); render(); toast(`${r.student.name} と連携しました。報酬：${preview(r.reward)}`); }
    catch (ex) { err(ex.offline ? "電波がつながっていません。" : ex.message); go.disabled = false; go.textContent = "連携する"; }
  });
}

/* ---------- 新しい版のお知らせ（Androidアプリから呼ばれる） ---------- */
let updBanner = null;
let updApkUrl = "";
window.QB.onUpdateAvailable = (version, notes, apkUrl) => {
  updApkUrl = apkUrl || "";
  if (updBanner) updBanner.remove();
  updBanner = document.createElement("div"); updBanner.className = "update px win drop";
  updBanner.innerHTML = `<p><b>新しい版（第${esc(version)}版）が届いています</b>${notes ? `<br><span class="hint">${esc(notes).slice(0, 120)}</span>` : ""}<span class="bar-progress" hidden><i></i></span></p>
    <div class="acts"><button class="btn red px" data-a="go">更新する</button></div>
    <button class="close-x" aria-label="あとで"><span data-icon="close"></span></button>`;
  fillIcons(updBanner);
  document.body.appendChild(updBanner);
  updBanner.querySelector('[data-a="go"]').onclick = (e) => { const b = e.currentTarget; b.disabled = true; b.textContent = "取得中"; updBanner.querySelector(".bar-progress").hidden = false; Native && Native.startUpdate(); };
  updBanner.querySelector(".close-x").onclick = () => { updBanner.remove(); updBanner = null; };
};
window.QB.onUpdateProgress = (pct) => { if (!updBanner) return; const i = updBanner.querySelector(".bar-progress i"); if (i) i.style.width = `${pct}%`; };
window.QB.onUpdateError = (msg) => {
  toast(msg || "更新を取得できませんでした。通信状態を確かめて、もう一度試してください。");
  if (!updBanner) return;
  const b = updBanner.querySelector('[data-a="go"]'); b.disabled = false; b.textContent = "もう一度";
  if (updApkUrl && Native && Native.openUrl && !updBanner.querySelector('[data-a="web"]')) {
    const w = document.createElement("button"); w.className = "btn px"; w.dataset.a = "web"; w.textContent = "ブラウザで入れる";
    w.onclick = () => Native.openUrl(updApkUrl);
    updBanner.querySelector(".acts").appendChild(w);
  }
};
window.QB.onUpToDate = () => toast("いまの版が最新です");

/* ---------- 効果音ボタン ---------- */
function drawSoundBtn() { $("#soundBtn").innerHTML = icon(soundOn ? "soundOn" : "soundOff"); $("#soundBtn").setAttribute("aria-pressed", soundOn); }

/* ---------- はじまり ---------- */
$("#viewBoard").addEventListener("click", (e) => { const n = e.target.closest(".notice"); if (n) { const q = quests.find((x) => x.id === n.dataset.id); if (q) openDetail(q); } });
$("#viewLedger").addEventListener("click", (e) => { const n = e.target.closest(".rec"); if (n) { const q = quests.find((x) => x.id === n.dataset.id); if (q) openDetail(q); } });
$("#tabBoard").onclick = () => { tab = "board"; render(); $("#wall").scrollTop = 0; };
$("#tabLedger").onclick = () => { tab = "ledger"; render(); $("#wall").scrollTop = 0; };
$("#fab").onclick = () => openEditor(null);
$("#soundBtn").onclick = () => { soundOn = !soundOn; LS.set("qb.sound", soundOn); drawSoundBtn(); toast(soundOn ? "効果音をオンにしました" : "効果音をオフにしました"); };

(async () => {
  makeTextures();
  fillIcons();
  drawSoundBtn();
  [heroSrc, heroClearSrc] = await Promise.all([spriteSrc("hero"), spriteSrc("hero-clear")]);
  if (heroClearSrc === BUILTIN_SPRITE && heroSrc !== BUILTIN_SPRITE) heroClearSrc = heroSrc;
  $("#hero").src = heroSrc;
  await Store.ready; await seedIfFirstRun(); await reload();
  if (Native && Native.pageReady) Native.pageReady();
  await ensureThumbs(); render();
  Link.flush();
  window.addEventListener("online", () => Link.flush());
  if (!Link.isLinked() && !LS.get("qb.linkAsked", false)) { LS.set("qb.linkAsked", true); openLinkWindow(); }
})();
</script>
